<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nettoyage cache — GrossistePPN</title>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #0f172a; color: #e2e8f0; }
    .box { text-align: center; padding: 2rem; }
    .spinner { width: 40px; height: 40px; border: 4px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 1rem auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #94a3b8; margin: 0.5rem 0; }
  </style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <p id="msg">Suppression du cache Service Worker...</p>
</div>
<script>
async function clearAll() {
  const msg = document.getElementById('msg');
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
      msg.textContent = regs.length + ' service worker(s) supprimé(s)';
    }
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
    msg.textContent = 'Cache vidé. Redirection...';
  } catch(e) {
    msg.textContent = 'Fait. Redirection...';
  }
  setTimeout(() => { window.location.replace('/pos/agent'); }, 1200);
}
clearAll();
</script>
</body>
</html>
