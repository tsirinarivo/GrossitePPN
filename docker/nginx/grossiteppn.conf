# ─────────────────────────────────────────────────────────────────────────────
# GrossistePPN — vhost Nginx natif
# À copier dans /etc/nginx/sites-available/grossiteppn
# Puis : ln -s /etc/nginx/sites-available/grossiteppn /etc/nginx/sites-enabled/
# Puis : nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Accès par IP (sans domaine pour l'instant)
# Quand tu auras un domaine, remplacer server_name par ton-domaine.mg

server {
    listen 80;
    server_name ppn.TON_IP_VPS;   # ou ton-domaine.mg quand tu l'auras

    # Logs dédiés
    access_log /var/log/nginx/grossiteppn.access.log;
    error_log  /var/log/nginx/grossiteppn.error.log;

    # Page d'erreur 502/503/504 personnalisée
    error_page 502 503 504 /502.html;
    location = /502.html {
        root /etc/nginx/error-pages/grossiteppn;
        internal;
    }

    # Taille upload (photos produits)
    client_max_body_size 20M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # ── Assets statiques Next.js — cache long ─────────────────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
    }

    # ── SSE temps réel — pas de buffering ─────────────────────────────────────
    location /api/stream/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # ── Tout le reste → Next.js ───────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
